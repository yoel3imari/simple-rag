services:
  simple-rag:
    container_name: simple-rag
    build: .
    shm_size: 1g
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]
    environment:
      # Default: host.docker.internal works on macOS Docker Desktop.
      # For Linux, override with: OLLAMA_BASE_URL=http://172.17.0.1:11434
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      PYTHONUNBUFFERED: "1"
    volumes:
      - rag-store:/home/appuser/app/store
      - hf-cache:/app/.cache/huggingface

volumes:
  rag-store:
  hf-cache:
