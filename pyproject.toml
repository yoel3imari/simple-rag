[project]
name = "simple-rag"
version = "0.1.0"
description = "Step-by-step RAG learning project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "quiver-vector-db>=0.1.4",
    "huggingface-hub>=0.20",
    "tokenizers>=0.15",
    "onnxruntime<1.20",  # macOS 12 compat (1.20+ requires macOS 14)
    "PyMuPDF>=1.24.0",  # v7: PDF text extraction (C ext, no PyTorch, excellent Arabic/Unicode)
]

[project.scripts]
simple-rag = "src.main:main"
